  <body class="bg-ink text-paper font-body antialiased preload">
    <script>
      // Apply the stored theme before first paint, so returning visitors
      // don't see a flash of the default palette before React mounts.
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          if (stored && stored !== 'faceted-dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) { /* localStorage unavailable (private mode, etc.) -- fall back to default */ }
      })();
    </script>
