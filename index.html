<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio of a software engineer building with React, Tailwind, and agentic AI workflows." />
    <title>Brent Besase — Software Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-ink text-paper font-body antialiased preload">
    <script>
      // Apply the stored theme before first paint, so returning visitors
      // don't see a flash of the default palette before React mounts.
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          if (stored && stored !== 'faceted-dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) { /* localStorage unavailable (private mode, etc.) -- fall back to default */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
