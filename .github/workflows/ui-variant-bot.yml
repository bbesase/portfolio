# UI variant bot: generates N implementations of a described UI element,
# judges them against CLAUDE.md's rubric, and keeps only the winner.
# Same auth and gating model as pr-review-loop.yml — restricted to
# ALLOWED_BASE_BRANCHES, subscription-authenticated.
#
# Three ways to trigger it: comment `/generate-ui <description>` on a PR,
# open a PR whose head branch name starts with `ui/` (the brief is read
# from the PR body's "## Brief" section, falling back to the whole body
# or the PR title), or run via the Actions tab (workflow_dispatch).
name: UI Variant Bot (Claude)

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to work in"
        required: true
      component_description:
        description: "What to design, e.g. 'the Projects card hover state'"
        required: true
      variant_count:
        description: "How many variants to generate (1-10)"
        required: false
        default: "5"

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

env:
  ALLOWED_BASE_BRANCHES: dev,staging,master

jobs:
  gate:
    if: >
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/generate-ui')) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       startsWith(github.head_ref, 'ui/'))
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
      pr_number: ${{ steps.check.outputs.pr_number }}
      head_ref: ${{ steps.check.outputs.head_ref }}
      brief: ${{ steps.check.outputs.brief }}
      count: ${{ steps.check.outputs.count }}
    steps:
      - name: Resolve PR, check base branch, parse brief
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const allowed = process.env.ALLOWED_BASE_BRANCHES.split(',').map(s => s.trim());
            const isDispatch = context.eventName === 'workflow_dispatch';
            const isPrEvent = context.eventName === 'pull_request';

            const prNumber = isDispatch
              ? Number(context.payload.inputs.pr_number)
              : isPrEvent
                ? context.payload.pull_request.number
                : context.issue.number;

            let brief = isDispatch ? context.payload.inputs.component_description : '';
            let count = isDispatch ? context.payload.inputs.variant_count : '5';

            if (isPrEvent) {
              // Branch-triggered (head ref starts with "ui/"): read the brief
              // from the PR body's "## Brief" section, falling back to the
              // whole body, then the PR title.
              const body = context.payload.pull_request.body || '';
              const match = body.match(/##\s*Brief\s*\n+([\s\S]*?)(\n##|$)/i);
              brief = (match ? match[1] : body).trim() || context.payload.pull_request.title;
            } else if (!isDispatch) {
              // Comment form: "/generate-ui <description>"
              const match = context.payload.comment.body.match(/\/generate-ui\s+(.*)/s);
              brief = match ? match[1].trim() : '';
            }

            const n = Math.max(1, Math.min(10, parseInt(count, 10) || 5));

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const isAllowed = allowed.includes(pr.base.ref) && brief.length > 0;
            core.setOutput('allowed', String(isAllowed));
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('brief', brief);
            core.setOutput('count', String(n));

            if (!allowed.includes(pr.base.ref)) {
              core.notice(`PR targets '${pr.base.ref}', which is not in ALLOWED_BASE_BRANCHES [${allowed.join(', ')}]. Skipping.`);
            }
            if (!brief) {
              core.notice('No component description found. Use "/generate-ui <description>".');
            }
        env:
          ALLOWED_BASE_BRANCHES: ${{ env.ALLOWED_BASE_BRANCHES }}

  generate:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pre-installed here (not left to Claude) so it doesn't cost the agent
      # turns/tool-calls, and so a flaky download can't derail the run.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate and judge variants
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          # A `prompt` input is required for the action to run in automation
          # mode. Without one, it falls back to interactive "@claude mention"
          # mode and no-ops on every event we actually use (issue_comment,
          # pull_request, workflow_dispatch alike).
          # show_full_output is normally a security risk (verbose tool output
          # can leak secrets and is publicly visible in logs), but this repo
          # only ever runs this workflow against its own owner's PRs -- no
          # untrusted external content is ever processed here -- and having
          # the full transcript is what actually let us diagnose the last
          # failure (an early, silent stop after a single denied tool call).
          show_full_output: true
          prompt: |
            Do this whole task yourself, directly and synchronously, across your own turns. Do not delegate any part of it (writing variants, building, screenshotting, judging, replacing the winner, cleanup, or writing the summary) to a background/async subagent or Task and then stop to "wait" for it -- this is a non-interactive environment with no one to resume you, so it ends your session the moment you produce a response with no further pending tool call, even if that response says you're waiting for something else to finish. A background task started that way never gets incorporated and the run silently ends up incomplete despite reporting success. If you do use a subagent for a sub-step, you must block on its result and incorporate it before your own turn ends.

            Follow CLAUDE.md for design tokens and the UI variant judging rubric. Brief: '${{ needs.gate.outputs.brief }}'. Generate exactly ${{ needs.gate.outputs.count }} distinct implementations of this brief, each a real, working variant (not a description) -- vary layout, motion, and emphasis while staying inside the design tokens. Keep each variant isolated (e.g. as separate component files or clearly separated branches of logic) so they can be compared. Verify each variant builds with `npm run build`.

            Then, for each variant in turn: wire it in temporarily, run `npm run build`, serve the build with `npm run preview -- --port <a distinct unused port per variant, e.g. 4180+n> --strictPort` in the background, use Playwright (`chromium` is already installed; import it from `@playwright/test`) to open a 1280x800 headless page against that server, and screenshot it to `variant-screenshots/v{n}.png` (1-indexed in generation order, e.g. `v1.png`, `v2.png`). If a single static frame can't show what the variant actually does -- a scroll-triggered reveal, a hover/interactive state, a multi-step animation -- take multiple screenshots capturing the distinct moments that matter (e.g. `v1-initial.png` and `v1-scrolled.png`, or `v1-idle.png` and `v1-hover.png`), simulating the real interaction (actually scroll the page / dispatch a hover, don't just guess a timestamp) rather than forcing everything into one shot. Using a different port per variant means you don't need to reliably stop each server before starting the next -- leftover background processes die with the runner, so don't spend effort on that. Every variant must get at least one screenshot, including the eventual winner and losers -- these are the only thing the human will actually look at to decide, so don't skip any.

            Then judge all variants against the rubric in CLAUDE.md, score each one, and pick a single winner. Replace the target UI with the winning variant only, delete the losing variants' code (but keep every variant's screenshot files -- those are the comparison record), run `npm run lint`, `npm run typecheck`, `npm run test -- --run`, and `npm run build` to confirm the final state is clean, then write a summary to UI_VARIANT_SUMMARY.md: the brief, and for each variant its score, one-line rationale, and its screenshot(s) embedded as `![v1](variant-screenshots/v1.png)` (exactly that relative path pattern, whatever the actual filename is -- it gets rewritten to a working URL automatically after you're done), ending with why the winner won.
          claude_args: |
            --max-turns 130
            --model claude-sonnet-4-6
            --allowedTools "Read,Edit,Write,Bash(npm run lint:*),Bash(npm run typecheck:*),Bash(npm run test:*),Bash(npm run build:*),Bash(npm run preview:*),Bash(node *),Bash(git *),Bash(mkdir:*),Bash(ls:*),Bash(kill:*),Bash(pkill:*),Bash(curl:*),Bash(sleep:*)"

      - name: Push winning variant to a review branch and open a PR
        uses: actions/github-script@v7
        env:
          HEAD_REF: ${{ needs.gate.outputs.head_ref }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          BRIEF: ${{ needs.gate.outputs.brief }}
          # claude-code-action revokes its own GitHub App installation token
          # as part of its cleanup right after the previous step finishes,
          # which leaves the checkout's git credentials dead for our push
          # below. Re-authenticate the remote with a fresh token here.
          PUSH_TOKEN: ${{ github.token }}
        with:
          script: |
            const { execFileSync } = require('child_process');
            const fs = require('fs');

            const baseRef = process.env.HEAD_REF; // the PR's own branch (dev/staging/master, whichever it targets)
            const prNumber = process.env.PR_NUMBER;
            const brief = process.env.BRIEF;
            const reviewBranch = `ui-variant/pr-${prNumber}-${context.runId}`;

            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' });

            git('config', 'user.name', 'claude-design-bot');
            git('config', 'user.email', 'actions@github.com');
            git('remote', 'set-url', 'origin', `https://x-access-token:${process.env.PUSH_TOKEN}@github.com/${context.repo.owner}/${context.repo.repo}.git`);
            git('add', '-A');

            let changed = true;
            try {
              git('diff', '--cached', '--quiet');
              changed = false;
            } catch { /* non-zero exit means there ARE staged changes */ }

            const summary = fs.existsSync('UI_VARIANT_SUMMARY.md')
              ? fs.readFileSync('UI_VARIANT_SUMMARY.md', 'utf8')
              : 'No summary was written.';

            if (!changed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(prNumber),
                body: `### 🎨 Claude UI variant bot\n\nNo changes were made.\n\n${summary}`,
              });
              return;
            }

            const commitTitle = `feat: agent-selected UI variant for ${brief}`.slice(0, 200);
            git('checkout', '-b', reviewBranch);
            git('commit', '-m', commitTitle);
            git('push', 'origin', reviewBranch);

            // Claude was told to reference screenshots as relative paths
            // (variant-screenshots/v1.png, etc.) since it has no way to know
            // the review branch name in advance. Now that the branch exists
            // and is pushed, rewrite those into raw.githubusercontent.com
            // URLs so the images actually render in the PR body/comment.
            const rawBase = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${reviewBranch}`;
            const summaryWithImages = summary.replace(
              /\]\(variant-screenshots\//g,
              `](${rawBase}/variant-screenshots/`,
            );

            // Open a PR from the review branch INTO the original PR's branch,
            // so the winning variant shows up as a normal, reviewable diff
            // rather than landing directly.
            const { data: reviewPr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `UI variant: ${brief}`.slice(0, 250),
              head: reviewBranch,
              base: baseRef,
              body: `Agent-generated UI variant for review. Merge this into \`${baseRef}\` once you're happy with it, or close it and re-run \`/generate-ui\` with a refined brief.\n\n${summaryWithImages}`,
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(prNumber),
              body: `### 🎨 Claude UI variant bot\n\nOpened #${reviewPr.number} with the winning variant for you to review before it merges into this branch.\n\n${summaryWithImages}`,
            });
