# Rigorous PR review bot. Runs Claude Code, authenticated with a Claude
# Pro/Max subscription (OAuth token, not a pay-per-token API key) — see
# README "Agent workflows" section for setup.
#
# Three ways to trigger it: comment `/deep-review` on a PR, open a PR whose
# head branch name starts with `review/`, or run via the Actions tab
# (workflow_dispatch). It never runs on synchronize/every push, and it only
# proceeds if the PR's base branch is in ALLOWED_BASE_BRANCHES, regardless
# of which trigger fired it.
name: PR Review Loop (Claude)

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

env:
  # Comma-separated list. Only PRs targeting one of these branches are
  # eligible, whether triggered by comment or by manual dispatch.
  ALLOWED_BASE_BRANCHES: master

jobs:
  gate:
    if: >
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/deep-review')) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       startsWith(github.head_ref, 'review/'))
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
      pr_number: ${{ steps.check.outputs.pr_number }}
      head_ref: ${{ steps.check.outputs.head_ref }}
    steps:
      - name: Resolve PR and check base branch
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const allowed = process.env.ALLOWED_BASE_BRANCHES.split(',').map(s => s.trim());
            const prNumber = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.pr_number)
              : context.eventName === 'pull_request'
                ? context.payload.pull_request.number
                : context.issue.number;

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const isAllowed = allowed.includes(pr.base.ref);
            core.setOutput('allowed', String(isAllowed));
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('head_ref', pr.head.ref);

            if (!isAllowed) {
              core.notice(`PR targets '${pr.base.ref}', which is not in ALLOWED_BASE_BRANCHES [${allowed.join(', ')}]. Skipping review.`);
            }
        env:
          ALLOWED_BASE_BRANCHES: ${{ env.ALLOWED_BASE_BRANCHES }}

  review:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rigorous review-fix-review loop
        uses: anthropics/claude-code-action@v1
        env:
          # Subscription auth (Pro/Max), not a pay-per-token API key.
          # Generate with `claude setup-token` — see README.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          # A `prompt` input is required for the action to run in automation
          # mode. Without one, it falls back to interactive "@claude mention"
          # mode and no-ops on every event we actually use (issue_comment,
          # pull_request, workflow_dispatch alike).
          prompt: |
            You are a rigorous senior code reviewer, working directly in this checked-out branch. Follow CLAUDE.md for the review rubric and design tokens. Loop up to 10 times: (1) review the diff against origin/master for correctness, accessibility, test coverage, and adherence to CLAUDE.md; (2) if you find real issues, fix them in the files directly, then run `npm run lint`, `npm run typecheck`, and `npm run test -- --run` and `npm run build` to confirm nothing broke; (3) re-review your own changes fresh, as if reviewing someone else's PR. Stop the loop early the first time a full pass finds no issues worth fixing -- do not manufacture busywork to fill 10 rounds. When done, commit any changes you made with a clear conventional-commit message, and write a short summary (what you found, what you changed, and why you stopped when you did) to REVIEW_SUMMARY.md — that file will be posted as a PR comment.
          claude_args: |
            --max-turns 40
            --model claude-sonnet-4-6
            --allowedTools "Read,Edit,Bash(npm run lint:*),Bash(npm run typecheck:*),Bash(npm run test:*),Bash(npm run build:*),Bash(git *)"

      - name: Push fixes and comment summary
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            execSync('git config user.name "claude-review-bot"');
            execSync('git config user.email "actions@github.com"');
            execSync('git add -A');
            let changed = true;
            try {
              execSync('git diff --cached --quiet');
              changed = false;
            } catch { /* non-zero exit means there ARE staged changes */ }
            if (changed) {
              execSync('git commit -m "chore: automated review fixes (Claude PR review loop)"');
              execSync(`git push origin HEAD:${{ needs.gate.outputs.head_ref }}`);
            }
            const summaryPath = 'REVIEW_SUMMARY.md';
            const fs = require('fs');
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8')
              : 'Claude reviewed this PR and found no changes to make.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ needs.gate.outputs.pr_number }}'),
              body: `### 🤖 Claude PR review loop\n\n${summary}`,
            });
